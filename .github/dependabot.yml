version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      dev-tools: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
  - package-ecosystem: pip
    directory: /tools/art
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
