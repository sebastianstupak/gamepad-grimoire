name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua:
    name: Lua - format, lint, types, tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the Lua toolchain image (busted, luacov, luacheck, LuaLS)
        run: npm run lua:image
      - name: Format (StyLua)
        run: npx stylua --check src spec
      - name: Lint (luacheck)
        run: node tools/lua.mjs luacheck .
      - name: Types (lua-language-server)
        run: npm run typecheck
      - name: Tests + coverage (busted, luacov >= 90%)
        run: |
          node tools/lua.mjs sh -c "busted --coverage -o gtest && luacov"
          node tools/coverage.mjs 90

  python:
    name: Python tools - ruff, pytest, generated art
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r tools/art/requirements.txt pytest==9.0.2 ruff==0.14.11
      - run: ruff check tools && ruff format --check tools
      - run: pytest -q
      - name: Generated art matches its sources
        run: |
          python tools/art/build.py
          git diff --exit-code -- src/Features/Controllers/Definitions.lua

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: commitlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
