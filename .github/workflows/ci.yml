name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua:
    name: Lua - format, lint, types, tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the Lua toolchain image (busted, luacov, luacheck, LuaLS)
        run: npm run lua:image
      - name: Format (StyLua)
        run: npx stylua --check src spec
      - name: Lint (luacheck)
        run: node tools/lua.mjs luacheck .
      - name: Types (lua-language-server)
        run: npm run typecheck
      - name: Tests + coverage (busted, luacov >= 90%)
        run: |
          node tools/lua.mjs sh -c 'busted --coverage -o utfTerminal > busted.out; s=$?; cat busted.out; luacov; exit $s'
          node tools/coverage.mjs 90
      - name: Badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tools/badges.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: badges
          path: badges/
          retention-days: 7

  badges:
    name: Publish badges
    needs: lua
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push to the badges branch only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: badges
          path: badges
      - name: Push to the badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(ci): update badges"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges

  python:
    name: Python tools - ruff, pytest, generated art
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r tools/requirements-ci.txt
      - run: ruff check tools && ruff format --check tools
      - run: pytest -q
      - name: Generated art matches its sources
        run: |
          python tools/art/build.py
          git diff --exit-code -- src/Features/Controllers/Definitions.lua

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: commitlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
