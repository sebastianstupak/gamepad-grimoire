name: Release

# Push a tag like v0.1.0 to package the addon and publish it.
# CurseForge / Wago uploads start once CF_API_KEY / WAGO_API_TOKEN secrets and the
# X-Curse-Project-ID / X-Wago-ID toc fields are set; until then only a GitHub
# release with the zip is created.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
    environment: release
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
