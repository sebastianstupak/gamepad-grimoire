# Git hooks (installed by `npm install` -> lefthook install).
# Lua tools run in the project's Docker image (tools/lua.mjs), the same as CI.

pre-commit:
  parallel: true
  commands:
    stylua:
      glob: "*.lua"
      run: npx stylua --check {staged_files}
    luacheck:
      glob: "*.lua"
      run: node tools/lua.mjs luacheck {staged_files}
    ruff:
      glob: "*.py"
      run: python -m ruff check {staged_files} && python -m ruff format --check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    check:
      run: npm run check
