# Python dev tooling for tools/ (art pipeline, e2e rig). The addon itself is Lua.
[project]
name = "gamepad-grimoire-tools"
version = "0"
requires-python = ">=3.12"
dependencies = ["Pillow==13.0.0", "resvg-py==0.5.0"]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.14.11"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tools/art/out", "tools/e2e/out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py"]
